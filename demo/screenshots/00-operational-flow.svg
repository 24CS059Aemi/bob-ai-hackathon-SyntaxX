<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">GridAdvisor Operational Flow</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="17" fill="#64748b">From live grid signals to an actionable field response</text>

  <rect x="70" y="180" width="220" height="135" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="180" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">1. Collect</text>
  <text x="180" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">Sensor readings</text>
  <text x="180" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">Weather + incidents</text>

  <rect x="350" y="180" width="220" height="135" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="460" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#991b1b">2. Score</text>
  <text x="460" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">Normalize signals</text>
  <text x="460" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">Calculate risk 0-100</text>

  <rect x="630" y="180" width="220" height="135" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="740" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412">3. Prioritise</text>
  <text x="740" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">Rank assets</text>
  <text x="740" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">Critical to Low</text>

  <rect x="910" y="180" width="220" height="135" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="1020" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#92400e">4. Plan</text>
  <text x="1020" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#78350f">Maintenance action</text>
  <text x="1020" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#78350f">Deadline + skills</text>

  <rect x="1190" y="180" width="150" height="135" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="1265" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#166534">5. Act</text>
  <text x="1265" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">Crew dispatch</text>
  <text x="1265" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#166534">Field response</text>

  <line x1="290" y1="247" x2="350" y2="247" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="570" y1="247" x2="630" y2="247" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="850" y1="247" x2="910" y2="247" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1130" y1="247" x2="1190" y2="247" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="210" y="430" width="980" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Operator Dashboard</text>
  <text x="700" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Overview: zone map + risk table + severity filters</text>
  <text x="700" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">View: inline 7-day sensor trends for S-01, T-01, and every asset</text>
  <text x="700" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">Maintenance | Crew | Bob AI briefing tabs</text>

  <line x1="740" y1="315" x2="740" y2="430" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="480" y="660" width="440" height="45" rx="10" fill="#0f172a"/>
  <text x="700" y="689" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">API refreshes dashboard data every 60 seconds</text>
</svg>
