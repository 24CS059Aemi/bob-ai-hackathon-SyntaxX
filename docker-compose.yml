version: "3.9"

services:
  grid-advisor:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database between restarts
      - grid_data:/data
    environment:
      - DATABASE_URL=sqlite:////data/grid_advisor.db
      - LIVE_INTERVAL_SECONDS=360
      # Optional: set your watsonx.ai credentials here or in a .env file
      # - WATSONX_API_KEY=your_key_here
      # - WATSONX_PROJECT_ID=your_project_id_here
    restart: unless-stopped

volumes:
  grid_data:
