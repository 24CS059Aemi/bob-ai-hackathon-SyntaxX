# Render.com deployment — native Python + Node build
# Free tier, auto-deploys on every push to main.

services:
  - type: web
    name: grid-advisor
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./grid_advisor.db
      - key: LIVE_INTERVAL_SECONDS
        value: "360"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RANDOM_SEED
        value: "42"
    healthCheckPath: /health
