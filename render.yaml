# Render.com deployment — native Python + Node build
# Free tier, auto-deploys on every push to main.
#
# ONE-TIME SETUP:
#   1. Go to https://render.com → sign in with GitHub
#   2. New → Web Service → connect 24CS059Aemi/bob-ai-hackathon-SyntaxX
#   3. Render reads this file automatically — just click "Create Web Service"
#   4. Your live URL: https://grid-advisor.onrender.com  (or similar)
#   5. Paste that URL into demo/live-demo-url.txt

services:
  - type: web
    name: grid-advisor
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r src/backend/requirements.txt &&
      cd src/frontend && npm ci --silent && VITE_API_URL="" npm run build && cd ../..
    startCommand: cd src/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./grid_advisor.db
      - key: LIVE_INTERVAL_SECONDS
        value: "360"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RANDOM_SEED
        value: "42"
      # Optional — add in Render dashboard for watsonx.ai features:
      # - key: WATSONX_API_KEY
      #   sync: false
      # - key: WATSONX_PROJECT_ID
      #   sync: false
    healthCheckPath: /health
