submission:
  title: "Power Outage Prediction & Grid Equipment Failure Advisor"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power transformers and substations across electric utility networks experience
    failures that can lead to blackouts, widespread service interruptions, and high
    operational costs. Utilities need a way to combine live asset health signals,
    weather forecasts, and incident history to identify outage-prone areas before they fail.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built an AI-powered Bob solution that ingests asset sensor data, weather forecast
    inputs, and historical incident records to forecast outage-prone grid zones and
    rank at-risk equipment. The system then generates a prioritized maintenance and crew
    pre-positioning plan for the grid operations team.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Predict outage-prone areas by combining weather forecasts with equipment sensor signals"
    - "Rank transformer, substation, and grid assets by health risk and outage impact"
    - "Generate prioritized maintenance and crew pre-positioning recommendations"
    - "Present grid impact severity and asset failure predictions in a dashboard"
    - "Use historical incidents to ground the outage risk model"

  tech_stack:
    languages: ["Python", "TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "IBM Cloud Functions"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL", "Redis"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker", "GitHub Actions", "Slack API"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The strongest part of our submission is the end-to-end grid intelligence workflow that
    connects asset health, weather, impact severity, and operational actions into one
    prioritised outage prevention plan.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    This prototype uses representative sample data and focuses on an offline decision-support
    workflow. Production deployment would need secure live sensor ingestion, data quality
    monitoring, and richer model validation with utility operations teams.

